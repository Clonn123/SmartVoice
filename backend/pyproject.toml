[project]
name = "smartvoice"
version = "0.1.0"
description = "FastAPI MVP base for a single-route AI call-center flow."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "uvicorn[standard]",
    "httpx",
    "vosk",
    "ari_client",
    "requests==2.31.0",
    "setuptools==69.0.3",
    "webrtcvad",
    "numpy",
    "scipy",
    "sqlalchemy",
    "celery",
    "asyncpg",
    "redis",
    "faster-whisper",
    "edge-tts",
    "soundfile",
    "pydub"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[project.optional-dependencies]
dev = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "uvicorn[standard]",
    "httpx",
    "vosk",
    "ari_client",
    "requests==2.31.0",
    "setuptools==69.0.3",
    "webrtcvad",
    "numpy",
    "scipy",
    "sqlalchemy",
    "celery",
    "asyncpg",
    "redis",
    "faster-whisper",
    "edge-tts",
    "soundfile",
    "pydub"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]